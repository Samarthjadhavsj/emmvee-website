services:

  mysql:
    image: mysql:8.0
    container_name: emmvee-mysql
    environment:
      MYSQL_DATABASE: emmvee_careers
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: emmvee-backend
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/emmvee_careers
      SPRING_DATASOURCE_USERNAME: root
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
    container_name: emmvee-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
