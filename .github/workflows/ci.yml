name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: ci_password

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: emmvee_careers
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build

    env:
      DB_PASSWORD: ci_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

  publish-images:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-build
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/samarthjadhavsj/emmvee-backend:latest ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=http://localhost:8081/api -t ghcr.io/samarthjadhavsj/emmvee-frontend:latest ./frontend

      - name: Push backend image
        run: docker push ghcr.io/samarthjadhavsj/emmvee-backend:latest

      - name: Push frontend image
        run: docker push ghcr.io/samarthjadhavsj/emmvee-frontend:latest
